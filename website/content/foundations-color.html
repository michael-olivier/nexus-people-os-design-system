<p class="eyebrow">Foundations</p>
<h1 class="ds-page-title">Color</h1>
<p class="ds-lede">Nine-step brand gradient plus semantic surface and text tokens. Swatches are generated from <code>tokens/tokens.css</code> at site build time.</p>

<section class="ds-section">
  <h2>Palette</h2>
  <div class="ds-swatches">
    {{paletteSwatches}}
  </div>
</section>

<section class="ds-section">
  <h2>Semantic tokens</h2>
  <div class="ds-swatches">
    {{semanticSwatches}}
  </div>
</section>

<section class="ds-section">
  <h2>CSS</h2>
  <pre class="ds-code"><code class="language-css">color: var(--text);
background: var(--surface);
border-color: var(--line);</code></pre>
</section>
